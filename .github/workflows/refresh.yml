name: Refresh FBI cases
on:
  schedule:
    - cron: '17 19 * * *'   # once a day (03:17 Taipei)
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Fetch, filter, cache portraits, prune
        run: python tools/build_cases.py | tee refresh.log
      - name: Commit only if something changed
        run: |
          git config user.name "look-again-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cases.json img img_failed.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh FBI cases: $(grep -o 'requests this refresh.*' refresh.log | head -1)"
          git push
