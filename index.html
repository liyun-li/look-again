 lgWanted:"起訴內容僅為指控，未經定罪前推定無罪。",lgMissing:"仍有人在找他們。若你知道任何消息，請告訴 FBI。",lgSeek:"FBI 正向大眾徵求線索，以查出相關人士身分。",
 noPic:"照片無法顯示",enNote:"以下為 FBI 英文原文",
 share:"分享",met:"這局遇到的人",again:"再玩一次",copied:"已複製！",
 foot:"資料：FBI Wanted（公有領域）",
 rank:["再多看幾眼","讀得很仔細","眼光很準","全數結案"],
 t1:(m,n)=>`這局的 ${n} 個人裡，<b>${m} 位</b>是失蹤或遭綁架的人，不是嫌疑人。`,
 t2:(k,m)=>`其中有 <b>${k}</b> 位被你歸到了犯罪類別。`,
 t2ok:m=>m?`你沒有把他們任何一位歸到犯罪類別。`:``,
 t3:"照片看不出誰需要幫助、誰在逃亡。再看一眼。",
 sh:(s,n,m,N)=>`再看一眼 🔎 ${s}/${n}\n${N} 個人裡有 ${m} 位不是嫌疑人，而是失蹤的人。`,
 metT:"這局遇到的人",fullFiled:"FBI 名單",fullDesc:"公告",fullText:"案情（FBI 英文原文）",fullRm:"備註",fullRw:"懸賞",fullW:"警告",
 cutNote:"此處略去外貌描述；完整公告請見 FBI 官方頁面。"
}};
const $=id=>document.getElementById(id);
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let L=(()=>{const q=new URLSearchParams(location.search).get('lang');if(q)return /^zh/i.test(q)?'zh':'en';const s=LS.get('la_lang');if(s)return s;
 const ls=navigator.languages||[navigator.language||'en'];for(const l of ls){if(/^zh/i.test(l))return 'zh';if(/^en/i.test(l))return 'en'}return 'en'})();
const T=k=>S[L][k];
let DATA=null,BY={},run=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c])}
function applyLang(){
 document.documentElement.lang=L==='zh'?'zh-Hant':'en';
 document.title=L==='zh'?'再看一眼 🔎':'Look Again 🔎';
 $('logo').innerHTML=L==='zh'?'再看<b>一眼</b>':'LOOK <b>AGAIN</b>';
 $('sTitle').innerHTML=L==='zh'?'再看<b>一眼</b>':'LOOK<b>AGAIN</b>';
 $('lEn').className=L==='en'?'on':'';$('lZh').className=L==='zh'?'on':'';
 document.querySelectorAll('[data-t]').forEach(e=>{const v=T(e.dataset.t);if(typeof v==='string')e.textContent=v});
 $('aboutLink').href='about.html'+(L==='zh'?'?lang=zh-Hant':'');document.querySelectorAll('.foot a').forEach(a=>a.href=$('aboutLink').href);
 if(DATA)$('upd').textContent=T('updated')(fmtDate(DATA.updated),DATA.n);
 if(run){hud();if($('game').classList.contains('on'))renderRound(true);if($('end').classList.contains('on'))renderEnd()}
}
function fmtDate(iso){const d=new Date(iso.replace('Z',':00Z'));if(isNaN(d))return iso.slice(0,10);
 return d.toLocaleDateString(L==='zh'?'zh-TW':'en-US',{year:'numeric',month:'short',day:'numeric'})}
$('langBtn').onclick=()=>{L=L==='zh'?'en':'zh';LS.set('la_lang',L);applyLang()};

async function load(){
 for(let k=0;k<3;k++){try{const r=await fetch('cases.json',{cache:'no-cache'});if(!r.ok)throw 0;const d=await r.json();if(!d.cases||!d.cases.length)throw 0;return d}catch(e){await new Promise(r=>setTimeout(r,600*(k+1)))}}
 throw new Error('load');
}
let loadP=null;
function boot(){loadP=load().then(d=>{DATA=d;BY={};for(const c of d.cases)(BY[c.c]=BY[c.c]||[]).push(c);
 $('upd').textContent=T('updated')(fmtDate(d.updated),d.n);const sv=LS.get('la_run');if(sv&&sv.ids&&sv.ids.every(id=>d.cases.some(c=>c.id===id))&&sv.i<ROUNDS)$('resumeBtn').hidden=false;return d}).catch(e=>{throw e});return loadP}
boot().catch(()=>{});

function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function newRun(){
 const seen=new Set(LS.get('la_seen')||[]);
 const pick=b=>{const pool=BY[b]||[];let fresh=pool.filter(c=>!seen.has(c.id)&&!chosen.includes(c));if(!fresh.length)fresh=pool.filter(c=>!chosen.includes(c));return fresh[Math.random()*fresh.length|0]};
 const chosen=[];
 const nm=MISS_MIN+(Math.random()<.4?1:0);
 for(let i=0;i<nm;i++){const c=pick('missing');if(c)chosen.push(c)}
 let bag=[];
 while(chosen.length<ROUNDS){if(!bag.length)bag=shuf(Object.keys(CAT).filter(b=>b!=='missing'&&BY[b]&&BY[b].length));const c=pick(bag.pop());if(c&&!chosen.includes(c))chosen.push(c)}
 shuf(chosen);
 const opts=chosen.map(c=>{const bad=new Set(c.all.concat([c.c]));let others=shuf(Object.keys(CAT).filter(b=>!bad.has(b)&&BY[b]));
  let d=others.slice(0,3);if(c.c!=='missing'&&!bad.has('missing')&&!d.includes('missing')&&Math.random()<.5)d[0]='missing';return shuf([c.c,...d])});
 run={ids:chosen.map(c=>c.id),opts,i:0,picks:[]};save();
}
function save(){LS.set('la_run',run)}
function cur(){return DATA.cases.find(c=>c.id===run.ids[run.i])}
function caseOf(id){return DATA.cases.find(c=>c.id===id)}
function hud(){const sc=run.picks.filter((p,i)=>p===caseOf(run.ids[i]).c).length;$('hud').textContent=`${Math.min(run.i+1,ROUNDS)}/${ROUNDS} · ✓${sc}`;$('prog').style.width=(run.picks.length/ROUNDS*100)+'%'}
function show(id){for(const s of ['start','game','end'])$(s).classList.toggle('on',s===id);document.body.classList.toggle('ingame',id==='game');document.body.classList.toggle('atend',id==='end')}
function money(n){if(!n)return T('noRw');if(L==='zh'){const w=n/1e4;return (w>=1?(w>=1e4?(w/1e4).toLocaleString('zh-TW')+' 億':w.toLocaleString('zh-TW',{maximumFractionDigits:1})+' 萬'):n.toLocaleString('zh-TW'))+' 美元'}
 return n>=1e6?'$'+(n/1e6).toLocaleString('en-US',{maximumFractionDigits:1})+' million':'$'+n.toLocaleString('en-US')}
const preloaded=new Set();
function preload(c){if(!c||!c.im||preloaded.has(c.im))return;preloaded.add(c.im);const i=new Image();i.decoding='async';i.src=c.im}
function renderRound(keep){
 const c=cur(),k=c.k,done=run.picks.length>run.i;
 $('caseNo').textContent=T('case')(run.i+1,ROUNDS);$('caseYr').textContent='';
 const cl=[];
 if(k.y)cl.push([T('year'),k.y]);
 if(k.age!=null)cl.push([T('age'),L==='zh'?`約 ${k.age} 歲`:`≈${k.age}`]);
 if(k.pl)cl.push([T('place'),L==='zh'?k.plz:k.pl]);else if(k.of)cl.push([T('office'),L==='zh'?k.ofz:k.of]);
 cl.push([T('reward'),money(k.rw)]);
 if(k.lg)cl.push([T('speaks'),(L==='zh'?k.lgz:k.lg).join(L==='zh'?'、':', ')]);
 if(k.oc)cl.push([T('work'),k.oc.join(', '),'en']);
 $('clues').innerHTML=cl.map(([a,b,lg])=>`<div class="clue"><small>${esc(a)}</small><span${lg&&L==='zh'?' lang="en"':''}>${esc(b)}</span></div>`).join('');
 const exH=esc(k.ex).replace(/▇▇/g,'<mark aria-label="redacted">▇▇</mark>').replace(/^Case: /,L==='zh'?'案情：':'Case: ');
 $('ex').innerHTML=`<small>${esc(T('ex'))}</small><span lang="en">${exH}</span>`;
 const o=run.opts[run.i];
 $('opts').innerHTML=o.map((b,j)=>`<button type="button" data-b="${b}" id="b${j}">${esc(CAT[b][L])}</button>`).join('');
 $('opts').querySelectorAll('button').forEach(btn=>btn.onclick=()=>answer(btn.dataset.b));
 $('game').classList.toggle('done',done);
 requestAnimationFrame(clipCheck);
 if(done)renderReveal(true);else if(!keep){preload(c);preload(caseOf(run.ids[run.i+1]))}
 hud();
}
function clipCheck(){const e=$('ex');e.classList.toggle('clip',e.scrollHeight>e.clientHeight+2);let m=$('moreBtn');
 if(e.scrollHeight>e.clientHeight+2&&!$('game').classList.contains('done')){if(!m){m=document.createElement('button');m.id='moreBtn';m.className='more';m.type='button';m.onclick=showEx;$('card').appendChild(m)}m.textContent=T('more');m.hidden=false}else if(m)m.hidden=true}
function showEx(){const c=cur();openDlg(T('ex'),`<p lang="en">${esc(c.k.ex).replace(/▇▇/g,'<mark style="background:#1d1b17;color:#1d1b17">▇▇</mark>')}</p>`)}
function answer(b){if(run.picks.length>run.i)return;run.picks.push(b);save();
 const c=cur();$('opts').querySelectorAll('button').forEach(x=>{x.disabled=true;if(x.dataset.b===c.c)x.classList.add('right');else if(x.dataset.b===b)x.classList.add('wrong')});
 $('game').classList.add('done');renderReveal(false);hud();if(navigator.vibrate)try{navigator.vibrate(b===c.c?15:[20,40,20])}catch(e){}
 preload(caseOf(run.ids[run.i+1]));preload(caseOf(run.ids[run.i+2]));
}
function renderReveal(re){
 const c=cur(),b=run.picks[run.i],ok=b===c.c;
 $('opts').querySelectorAll('button').forEach(x=>{x.disabled=true;x.classList.toggle('right',x.dataset.b===c.c);x.classList.toggle('wrong',x.dataset.b===b&&!ok)});
 const m=$('moreBtn');if(m)m.hidden=true;
 $('verdict').textContent=ok?T('right'):T('wrong');$('verdict').className='verdict '+(ok?'ok':'no');
 $('rname').textContent=c.title;$('rname').lang='en';
 $('rcat').textContent=T('was')+' '+CAT[c.c][L];
 const first=(c.r.t||[]).slice(0,2).join(' ');
 $('rd').innerHTML=(L==='zh'?`<span style="display:block;font-weight:700">${esc(T('enNote'))}</span>`:'')+`<span lang="en">${esc(c.r.d?c.r.d+' — ':'')}${esc(first)}</span>`;
 $('rlegal').textContent=c.c==='missing'?T('lgMissing'):c.c==='seeking'?T('lgSeek'):T('lgWanted');
 $('fbiLink').href=c.url;
 const pic=$('pic');pic.innerHTML='';
 if(c.im){const im=new Image();im.alt=c.title;im.decoding='async';im.onerror=()=>{pic.textContent=T('noPic')};im.src=c.im;pic.appendChild(im)}else pic.textContent=T('noPic');
 $('next').textContent=run.i+1>=ROUNDS?T('finish'):T('next');
 if(!re)setTimeout(()=>$('next').focus({preventScroll:true}),50);
}
function fullPoster(){const c=cur(),r=c.r;let h='';
 h+=`<h3>${esc(T('fullFiled'))}</h3><p>${esc(CAT[c.c][L])}</p>`;
 if(L==='zh')h+=`<p><b>${esc(T('enNote'))}</b></p>`;
 if(r.w)h+=`<p class="w" lang="en">${esc(r.w)}</p>`;
 if(r.d)h+=`<h3>${esc(T('fullDesc'))}</h3><p lang="en">${esc(r.d)}</p>`;
 if(r.t&&r.t.length)h+=`<h3>${esc(T('fullText'))}</h3>`+r.t.map(s=>`<p lang="en">${esc(s)}</p>`).join('');
 if(r.rm&&r.rm.length)h+=`<h3>${esc(T('fullRm'))}</h3>`+r.rm.map(s=>`<p lang="en">${esc(s)}</p>`).join('');
 if(r.rw)h+=`<h3>${esc(T('fullRw'))}</h3><p lang="en">${esc(r.rw)}</p>`;
 h+=`<p><i>${esc(c.c==='missing'?T('lgMissing'):c.c==='seeking'?T('lgSeek'):T('lgWanted'))}</i></p><p><i>${esc(T('cutNote'))}</i></p>`;
 h+=`<p><a href="https://tips.fbi.gov/" target="_blank" rel="noopener"><b>${esc(T('tip'))}</b></a><br><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(T('fbi'))}</a></p>`;
 openDlg(c.title,h)}
$('fullBtn').onclick=fullPoster;
function openDlg(t,h){$('dlgT').textContent=t;$('dlgB').innerHTML=h;$('dlgB').scrollTop=0;const d=$('dlg');if(!d.open){d.showModal();history.pushState({dlg:1},'')}}
function closeDlg(){const d=$('dlg');if(d.open){d.close();if(history.state&&history.state.dlg)history.back()}}
$('dlgX').onclick=closeDlg;$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))closeDlg()});
$('dlg').addEventListener('cancel',e=>{e.preventDefault();closeDlg()});
addEventListener('popstate',()=>{const d=$('dlg');if(d.open)d.close()});
$('next').onclick=()=>{run.i++;save();if(run.i>=ROUNDS){finish()}else{renderRound();$('b0')&&$('b0').focus({preventScroll:true})}};
function finish(){const seen=new Set(LS.get('la_seen')||[]);run.ids.forEach(i=>seen.add(i));LS.set('la_seen',[...seen].slice(-400));LS.set('la_last',run);LS.del('la_run');$('resumeBtn').hidden=true;show('end');renderEnd()}
function stats(){const cs=run.ids.map(caseOf);const sc=run.picks.filter((p,i)=>p===cs[i].c).length;const mi=cs.filter(c=>c.c==='missing').length;
 const mc=cs.filter((c,i)=>c.c==='missing'&&run.picks[i]&&CAT[run.picks[i]].crime).length;return{cs,sc,mi,mc}}
function renderEnd(){const{cs,sc,mi,mc}=stats();
 $('score').textContent=`${sc}/${ROUNDS}`;$('rank').textContent=T('rank')[sc>=10?3:sc>=7?2:sc>=4?1:0];
 $('grid').textContent=cs.map((c,i)=>run.picks[i]===c.c?'🟩':'🟥').join('');
 $('take').innerHTML=`<p>${T('t1')(mi,ROUNDS)}</p><p>${mc?T('t2')(mc,mi):T('t2ok')(mi)}</p><p>${esc(T('t3'))}</p>`;
 $('hud').textContent=`${ROUNDS}/${ROUNDS} · ✓${sc}`;$('prog').style.width='100%'}
$('metBtn').onclick=()=>{const{cs}=stats();openDlg(T('metT'),`<ul>${cs.map((c,i)=>`<li>${c.im?`<img src="${esc(c.im)}" alt="" loading="lazy">`:''}<div><a href="${esc(c.url)}" target="_blank" rel="noopener" lang="en">${esc(c.title)}</a><br>${esc(CAT[c.c][L])} ${run.picks[i]===c.c?'✓':'✗'}</div></li>`).join('')}</ul><p><a href="https://tips.fbi.gov/" target="_blank" rel="noopener"><b>${esc(T('tip'))}</b></a></p>`)};
$('shareBtn').onclick=async()=>{const{cs,sc,mi}=stats();const txt=T('sh')(sc,ROUNDS,mi,ROUNDS)+'\n'+cs.map((c,i)=>run.picks[i]===c.c?'🟩':'🟥').join('');const url='https://liyun-li.github.io/look-again/';
 try{if(navigator.share){await navigator.share({text:txt,url});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(txt+'\n'+url);$('toast').textContent=T('copied')}catch(e){$('toast').textContent=txt}setTimeout(()=>$('toast').textContent='',2500)};
async function startGame(resume){
 show('game');$('loading').hidden=false;$('retryBtn').hidden=true;$('loading').firstElementChild.textContent=T('loading');
 $('game').classList.add('wait');$('game').classList.remove('done');$('opts').innerHTML='';
 try{await (loadP||boot())}catch(e){loadP=null;$('loading').firstElementChild.textContent=T('loadFail');$('retryBtn').hidden=false;return}
 $('loading').hidden=true;$('game').classList.remove('wait');
 if(resume){run=LS.get('la_run')}else newRun();
 renderRound();$('b0')&&$('b0').focus({preventScroll:true})}
$('goBtn').onclick=()=>startGame(false);$('resumeBtn').onclick=()=>startGame(true);
$('retryBtn').onclick=()=>{loadP=null;startGame(false)};
$('againBtn').onclick=()=>startGame(false);
addEventListener('resize',()=>{if($('game').classList.contains('on')&&run&&!$('game').classList.contains('done'))clipCheck()});
addEventListener('keydown',e=>{if($('dlg').open)return;if($('game').classList.contains('on')&&run){const n='1234'.indexOf(e.key);if(n>=0&&$('b'+n)&&!$('b'+n).disabled){$('b'+n).click()}else if(e.key==='Enter'&&$('game').classList.contains('done')&&document.activeElement===document.body)$('next').click()}});
applyLang();
</script>
</body></html>
