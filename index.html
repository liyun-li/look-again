// Charge headline + zh gist, derived only from the FBI poster's own charge text (r.d) or first sentence (r.t).

const CHG=[

 [/passport|false document|visa/i,'偽造證件'],[/stalking|harassment/i,'跟蹤騷擾'],[/escape/i,'逃獄'],[/surrender for service of sentence/i,'拒不入監服刑'],[/naturaliz|citizenship/i,'非法取得公民身分'],[/hobbs act/i,'勒索'],[/failure to appear/i,'未出庭'],[/obstruction/i,'妨礙司法'],[/\btax/i,'逃漏稅'],[/theft|stolen/i,'竊盜']];
const BORING=/^(aiding and abetting|conspiracy|criminal forfeiture|forfeiture)$/i;
function rankOf(s){for(let i=0;i<CHG.length;i++)if(CHG[i][0].test(s))return i;return 99}
function tidy(s){s=String(s||'').trim().replace(/\.$/,'').replace(/^unlawful flight to avoid prosecution\s*[-–:]\s*/i,'Fled prosecution: ');const o=(s.match(/\(/g)||[]).length-(s.match(/\)/g)||[]).length;if(o>0)s+=')'.repeat(o);if(s&&s===s.toUpperCase())s=s.toLowerCase().replace(/(^|[\s(\-])(\w)/g,(m,a,b)=>a+b.toUpperCase());return s}
function firstSentence(t){const s=String(t||'').trim();const m=s.match(/^.{20,}?[a-z0-9)"”’][.!?](?=\s|$)/);return (m?m[0]:s)}
function clip(s,n){s=String(s||'');if(s.length<=n)return s;const c=s.slice(0,n);return c.slice(0,Math.max(c.lastIndexOf(' '),n*.6|0)).replace(/[,;:\s]+$/,'')+'…'}
// returns {head:'EN charge headline', more:n extra charges, zh:'中文重點' or ''}
function chargeOf(c){const r=c.r||{};const d=String(r.d||'').trim();let parts=d?d.split(/;\s*/).map(tidy).filter(Boolean):[];
 let head,more=0;
 if(parts.length){const cand=parts.filter(p=>!BORING.test(p));const pool=cand.length?cand:parts;
  head=pool.slice().sort((a,b)=>rankOf(a)-rankOf(b))[0];more=parts.length-1}
 else{const s=firstSentence((r.t||[])[0]);const m=s.match(/\bis wanted (for .+?)[.]?$/i);head=m?'Wanted '+m[1]:clip(s,140)}
 const src=d||((r.t||[])[0]||'');const zs=[];
 for(const p of (parts.length?parts:[src])){const k=rankOf(p);if(k<99&&!zs.includes(CHG[k][1]))zs.push(CHG[k][1])}
 zs.sort((a,b)=>CHG.findIndex(x=>x[1]===a)-CHG.findIndex(x=>x[1]===b));
 return {head:clip(head,150),more,q:/^wanted for questioning/i.test(head),zh:zs.slice(0,3).join('、')}}

const PTS=[3,1],LIVES=3,DOCKET=5,EPOCH=Date.UTC(2026,10,2),GUARD=350;

const catTxt=g=>CAT[g].e+' '+CAT[g][L];
const S={en:{

},zh:{

 q:"通緝罪名是？",caseD:(i,n)=>`${i}/${n}`,
 peek:"💡 偷看線索",peekCost:"+3 → +1",peeked:"已看線索・現在 +1",
 right:p=>`✓ 一眼看穿！+${p}`,wrong:"✗ 被直覺騙了",
 wantedFor:"涉嫌",moreCh:n=>`（另有 ${n} 項）`,

 helpT:"💛 這不是遊戲：幫忙找人",helpP:"失蹤者，不計分。若你知道任何消息，請告訴 FBI。",since:y=>`${y} 年起失蹤`,tipS:"提供線索 ↗",

}};
const $=id=>document.getElementById(id);
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let L=(()=>{const q=new URLSearchParams(location.search).get('lang');if(q)return /^zh/i.test(q)?'zh':'en';const s=LS.get('la_lang');if(s)return /^zh/i.test(s)?'zh':'en';
 const ls=navigator.languages||[navigator.language||'en'];for(const l of ls){if(/^zh/i.test(l))return 'zh';if(/^en/i.test(l))return 'en'}return 'en'})();
const T=k=>S[L][k];
let DATA=null,BYID={},POOL={},MISSING=[],run=null,lastEnd=null,tGuard=0;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c])}
function h32(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=h32(String(seed));return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,r=Math.random){for(let i=a.length-1;i>0;i--){const j=r()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
// Daily resets at midnight Asia/Taipei for everyone.
function today(){const d=new Date(Date.now()+8*36e5);return d.toISOString().slice(0,10)}
function dayNo(day){const [y,m,d]=day.split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-EPOCH)/864e5)+1}
function grp(c){return GMAP[c.c]}
function grpSet(c){const s=new Set([grp(c)]);for(const a of c.all||[])if(GMAP[a])s.add(GMAP[a]);return s}
async function getJSON(u,tries){for(let k=0;k<tries;k++){try{const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw 0;return await r.json()}catch(e){if(k<tries-1)await new Promise(r=>setTimeout(r,600*(k+1)))}}throw new Error('load')}
let loadP=null;
function boot(){loadP=getJSON('cases.json',3).then(d=>{if(!d.cases||!d.cases.length)throw new Error('empty');DATA=d;BYID={};POOL={};MISSING=[];
 for(const c of d.cases){BYID[c.id]=c;const g=grp(c);if(g&&c.im&&c.fq)(POOL[g]=POOL[g]||[]).push(c);else if(c.c==='missing'&&c.im)MISSING.push(c)}
 if(!GROUPS.some(g=>(POOL[g]||[]).length))throw new Error('empty');
 $('upd').textContent=T('updated')(fmtDate(d.updated),poolN());renderStart();return d});
 return loadP}
function poolN(){return GROUPS.reduce((s,g)=>s+(POOL[g]||[]).length,0)}
boot().catch(()=>{});
function fmtDate(iso){const d=new Date(String(iso).replace(/Z$/,':00Z'));if(isNaN(d))return String(iso).slice(0,10);
 return d.toLocaleDateString(L==='zh'?'zh-TW':'en-US',{year:'numeric',month:'short',day:'numeric',timeZone:'Asia/Taipei'})}
function clueOf(c){const f=c.k&&c.k.cl&&c.k.cl[L];if(Array.isArray(f)){const v=f.filter(x=>typeof x==='string'&&x.trim());if(v.length)return v}return []}
function hl(x){return esc(x).replace(/▇+/g,m=>`<mark aria-label="redacted">${m}</mark>`)}
// ---- runs ----
function docketIds(day){const r=rng('face|'+day),cnt={},ids=[];
 // always one violent and one fraud/hacking face, so the day has a real "wait, WHAT" contrast
 const plan=['violent',r()<.5?'money':'cyber'];
 while(plan.length<DOCKET){const g=GROUPS[r()*GROUPS.length|0];if(plan.filter(x=>x===g).length<2)plan.push(g)}
 shuf(plan,r);
 for(const g0 of plan){let g=g0;if(!(POOL[g]||[]).length)g=GROUPS.find(x=>(POOL[x]||[]).length);
  const best=POOL[g].filter(c=>!ids.includes(c.id)).map(c=>[h32(day+'|'+c.id),c.id]).sort((a,b)=>a[0]-b[0])[0];if(best)ids.push(best[1])}
 return ids}
function optsFor(c,r=Math.random){const set=grpSet(c),g=grp(c);const d=shuf(GROUPS.filter(x=>!set.has(x)&&(POOL[x]||[]).length),r).slice(0,3);return shuf([g,...d],r)}
function pickEndless(){const seen=new Set(LS.get('la2_seen')||[]);const used=new Set(run?run.ids:[]);
 const gs=GROUPS.filter(g=>(POOL[g]||[]).length);const last=run&&run.ids.length?grp(BYID[run.ids[run.ids.length-1]]):null;
 let g=gs[Math.random()*gs.length|0];if(g===last&&gs.length>1)g=gs[Math.random()*gs.length|0];
 let p=POOL[g].filter(c=>!seen.has(c.id)&&!used.has(c.id));if(!p.length)p=POOL[g].filter(c=>!used.has(c.id));if(!p.length)p=POOL[g];return p[Math.random()*p.length|0].id}
function newDaily(){const day=today(),ids=docketIds(day),r=rng('fopts|'+day);run={mode:'d',day,ids,opts:ids.map(id=>optsFor(BYID[id],r)),i:0,pk:0,res:[]};save()}
function newEndless(){run={mode:'e',ids:[],opts:[],i:0,pk:0,res:[],lives:LIVES};addEndless();save()}
function addEndless(){const id=pickEndless();run.ids.push(id);run.opts.push(optsFor(BYID[id]))}
function save(){LS.set(run.mode==='d'?'la4_daily':'la4_endless',run)}
function cur(){return BYID[run.ids[run.i]]}
function score(r=run){return r.res.reduce((s,x)=>s+x.p,0)}
function rightN(r=run){return r.res.filter(x=>x.ok).length}
function show(id){for(const s of ['start','game','end'])$(s).classList.toggle('on',s===id);document.body.classList.toggle('ingame',id==='game');document.body.classList.toggle('atend',id==='end');if(id==='start'){$('hud').textContent='';$('prog').style.width='0'}}
function bump(e){e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
function hud(){if(!run)return;const sc=score();
 if(run.mode==='d'){$('hud').textContent=`${Math.min(run.i+1,run.ids.length)}/${run.ids.length} · ${sc} ${L==='zh'?'分':'pts'}`;$('prog').style.width=(run.res.length/run.ids.length*100)+'%'}
 else{$('hud').textContent=`${'❤️'.repeat(Math.max(0,run.lives))}${'🖤'.repeat(LIVES-Math.max(0,run.lives))} · ${sc}`;$('prog').style.width=((LIVES-run.lives)/LIVES*100)+'%'}}
function preload(i){const id=run&&run.ids[i];const c=id&&BYID[id];if(c&&c.im){const im=new Image();im.decoding='async';im.src=c.im}}
function nameOf(c){return (c.title||'').split(/ - | – /)[0]}
function titleCase(s){return s.toLowerCase().replace(/(^|[\s\-'"(])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase())}
function setPic(c,alt){const pic=$('pic');pic.querySelectorAll('img,.nop').forEach(e=>e.remove());
 if(c.im){const im=new Image();im.alt=alt;im.decoding='async';im.onerror=()=>{im.remove();const s=document.createElement('span');s.className='nop';s.textContent=T('noPic');pic.prepend(s)};im.src=c.im;pic.prepend(im)}
 else{const s=document.createElement('span');s.className='nop';s.textContent=T('noPic');pic.prepend(s)}}
function renderRound(fresh){
 const c=cur(),done=run.res.length>run.i,cl=clueOf(c);
 $('caseNo').textContent=run.mode==='d'?T('caseD')(run.i+1,run.ids.length):'#'+(run.i+1);
 $('worth').textContent='+'+PTS[run.pk?1:0];$('worth').hidden=done;
 if(fresh||$('pic').dataset.id!==c.id){setPic(c,done?nameOf(c):(L==='zh'?'通緝照':'Wanted poster photo'));$('pic').dataset.id=c.id;if(fresh)bump($('pic'))}
 else{const im=$('pic').querySelector('img');if(im)im.alt=done?nameOf(c):(L==='zh'?'通緝照':'Wanted poster photo')}
 $('clue').hidden=!run.pk||!cl.length;$('clue').innerHTML=run.pk&&cl.length?`<b>💡</b> <span>${hl(cl[0])}</span>`:'';
 const pb=$('peekBtn');pb.hidden=!cl.length;pb.disabled=!!run.pk;pb.innerHTML=run.pk?esc(T('peeked')):`${esc(T('peek'))} <small>${esc(T('peekCost'))}</small>`;
 $('opts').innerHTML=run.opts[run.i].map((b,j)=>`<button type="button" data-b="${b}" id="b${j}"><span class="e" aria-hidden="true">${CAT[b].e}</span><span class="t">${esc(CAT[b][L])}</span></button>`).join('');
 $('opts').querySelectorAll('button').forEach(btn=>btn.onclick=()=>answer(btn.dataset.b));
 $('stamp').className='stamp';$('stamp').textContent='';
 $('game').classList.toggle('done',done);
 if(done)renderReveal(true);
 if(fresh)tGuard=Date.now();
 hud();preload(run.i+1)}
function peek(){if(!run||run.res.length>run.i||run.pk||!clueOf(cur()).length)return;run.pk=1;save();renderRound(false);bump($('worth'));if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}}
$('peekBtn').onclick=peek;
function answer(b){if(!run||run.res.length>run.i||Date.now()-tGuard<GUARD)return;const c=cur(),ok=grpSet(c).has(b),p=ok?PTS[run.pk?1:0]:0;
 run.res.push({b,n:run.pk?2:1,ok,p,g:grp(c)});if(run.mode==='e'&&!ok)run.lives--;save();addBook(c,ok,p);tGuard=Date.now();
 $('game').classList.add('done');renderReveal(false);hud();bump($('hud'));if(navigator.vibrate)try{navigator.vibrate(ok?[15,30,15]:[40])}catch(e){}}
function renderReveal(re){const c=cur(),x=run.res[run.i],g=grp(c),ch=chargeOf(c);
 $('worth').hidden=true;
 const st=$('stamp');st.className='stamp on '+(x.ok?'ok':'no');st.textContent=x.ok?`+${x.p}`:'✗';
 $('verdict').textContent=x.ok?T('right')(x.p):T('wrong');$('verdict').className='verdict '+(x.ok?'ok':'no');
 $('rcat').innerHTML=`<span aria-hidden="true">${CAT[g].e}</span> ${esc(CAT[g][L])}`+(x.ok?'':` <s>${esc(CAT[x.b].e+' '+CAT[x.b][L])}</s>`);
 $('rname').textContent=titleCase(nameOf(c));
 let h='';
 if(L==='zh'){h+=`<span class="zh"><b>${esc(ch.q?'FBI 要約談':T('wantedFor'))}</b>${ch.zh?'：'+esc(ch.zh):''}</span>`;
  h+=`<span class="en" lang="en"><i>${esc(T('enNote'))}</i> ${esc(ch.head)}${ch.more?esc(S.en.moreCh(ch.more)):''}</span>`}
 else h+=`<span class="en"><b>${ch.q?'':esc(T('wantedFor'))+': '}</b>${esc(ch.head)}${ch.more?`<small>${esc(T('moreCh')(ch.more))}</small>`:''}</span>`;
 $('rhead').innerHTML=h;
 $('rline').innerHTML=lineOf(c,ch);
 $('fbiLink').href=c.url;$('rlegal').textContent=T('lgWanted');
 const im=$('pic').querySelector('img');if(im)im.alt=nameOf(c);
 const over=run.mode==='d'?run.i+1>=run.ids.length:run.lives<=0;$('next').textContent=over?T('finish'):T('next');
 if(!re)setTimeout(()=>$('next').focus({preventScroll:true}),60)}
function lineOf(c,ch){if(L==='zh'){const cl=clueOf(c);const z=cl.length>1&&run.pk?cl[1]:cl[0];return z?hl(z):''}
 const t=(c.r.t||[]);for(const s0 of t){const s=firstSentence(s0);if(s&&s.indexOf(ch.head.replace(/…$/,''))<0)return esc(clip(s,170))}return ''}
function fullPoster(){const c=cur(),r=c.r;let h='';
 h+=`<h3>${esc(T('fullFiled'))}</h3><p>${esc(catTxt(grp(c)))}</p>`;
 if(r.w)h+=`<p class="w" lang="en">${esc(r.w)}</p>`;
 if(r.d)h+=`<h3>${esc(T('fullDesc'))}</h3><p lang="en">${esc(r.d)}</p>`;
 if(r.t&&r.t.length)h+=`<h3>${esc(T('fullText'))}</h3>`+r.t.map(s=>`<p lang="en">${esc(s)}</p>`).join('');
 if(r.rm&&r.rm.filter(Boolean).length)h+=`<h3>${esc(T('fullRm'))}</h3>`+r.rm.filter(Boolean).map(s=>`<p lang="en">${esc(s)}</p>`).join('');
 if(r.rw)h+=`<h3>${esc(T('fullRw'))}</h3><p lang="en">${esc(r.rw)}</p>`;
 h+=`<p><i>${esc(T('lgWanted'))}</i></p><p><i>${esc(T('cutNote'))}</i></p>`;
 h+=`<p><a href="https://tips.fbi.gov/" target="_blank" rel="noopener"><b>${esc(T('tip'))}</b></a><br><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(T('fbi'))}</a></p>`;
 openDlg(titleCase(nameOf(c)),h)}
$('fullBtn').onclick=fullPoster;
function openDlg(t,h){$('dlgT').textContent=t;$('dlgB').innerHTML=h;$('dlgB').scrollTop=0;const d=$('dlg');if(!d.open){d.showModal();history.pushState({dlg:1},'')}}
function closeDlg(){const d=$('dlg');if(d.open){d.close();if(history.state&&history.state.dlg)history.back()}}
$('dlgX').onclick=closeDlg;$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))closeDlg()});
$('dlg').addEventListener('cancel',e=>{e.preventDefault();closeDlg()});
addEventListener('popstate',()=>{const d=$('dlg');if(d.open)d.close()});
$('next').onclick=()=>{if(Date.now()-tGuard<GUARD)return;const over=run.mode==='d'?run.i+1>=run.ids.length:run.lives<=0;
 if(over){finish();return}run.i++;run.pk=0;if(run.mode==='e'&&run.i>=run.ids.length)addEndless();save();renderRound(true);$('b0')&&$('b0').focus({preventScroll:true})};
// ---- casebook ----
function addBook(c,ok,p){const b=(LS.get('la2_book')||[]).filter(x=>x.id!==c.id);
 b.unshift({id:c.id,t:nameOf(c),g:grp(c),l:c.c,u:c.url,d:today(),ok,p});LS.set('la2_book',b.slice(0,400))}
function closedIds(){if(!DATA)return[];return (LS.get('la2_book')||[]).filter(x=>!BYID[x.id]).map(x=>x.id)}
function newClosed(){const seen=new Set(LS.get('la2_closedSeen')||[]);return closedIds().filter(i=>!seen.has(i)).length}
const RES={captured:['Captured','已逮捕'],surrendered:['Surrendered','已自首'],located:['Located','已尋獲'],recovered:['Recovered','已尋回'],resolved:['Resolved','已解決']};
function closedNote(id){const r=DATA&&DATA.res&&DATA.res[id];return r&&RES[r]?`<br><b>${esc((L==='zh'?'FBI 標示狀態：':'FBI status: ')+RES[r][L==='zh'?1:0])}</b>`:''}
function openBook(){const b=LS.get('la2_book')||[];const cl=closedIds();let h='';
 if(!b.length)h=`<p>${esc(T('bookEmpty'))}</p>`;
 else{h=`<p>${esc(T('bookIntro')(b.length,cl.length))}</p><ul>`+b.map(x=>{const live=BYID[x.id];
  const img=live&&live.im?`<img src="${esc(live.im)}" alt="" loading="lazy">`:`<span class="ph" aria-hidden="true">📁</span>`;
  const st=live?`<span class="open">${esc(T('stillOpen'))}</span>`:`<span class="closed">${esc(T('closed'))}</span>${closedNote(x.id)}`;
  const g=CAT[x.g]||CAT[GMAP[x.l]]||null;
  return `<li>${img}<div><a href="${esc(x.u)}" target="_blank" rel="noopener" lang="en">${esc(titleCase(x.t||''))}</a><br>${g?esc(g.e+' '+g[L]):''} ${x.ok?'✓ +'+x.p:'✗'} · <small>${esc(T('played')(x.d))}</small><br>${st}</div></li>`}).join('')+`</ul>`;
  if(cl.length)h+=`<p><small>${esc(T('closedWhy'))}</small></p>`}
 h+=`<p><a href="https://tips.fbi.gov/" target="_blank" rel="noopener"><b>${esc(T('tip'))}</b></a></p>`;
 LS.set('la2_closedSeen',cl);openDlg(T('bookT'),h);renderStart()}
$('bookBtn').onclick=openBook;$('book2Btn').onclick=openBook;
// ---- end ----
function finish(){const seen=new Set(LS.get('la2_seen')||[]);run.ids.forEach(i=>seen.add(i));LS.set('la2_seen',[...seen].slice(-500));
 if(run.mode==='d'){const days=new Set(LS.get('la2_days')||[]);days.add(run.day);LS.set('la2_days',[...days].sort().slice(-400));
  const res=LS.get('la4_dres')||{};res[run.day]={res:run.res,ids:run.ids};LS.set('la4_dres',res);run.fin=1;save()}
 else{const b=LS.get('la4_best')||0;run.best=b;if(score()>b)LS.set('la4_best',score());LS.del('la4_endless')}
 lastEnd=run;show('end');renderEnd()}
function streak(){const days=new Set(LS.get('la2_days')||[]);let n=0;const d=new Date(Date.now()+8*36e5);if(!days.has(today()))d.setUTCDate(d.getUTCDate()-1);
 for(;;){const s=d.toISOString().slice(0,10);if(!days.has(s))break;n++;d.setUTCDate(d.getUTCDate()-1)}return n}
function sq(x){return x.ok?(x.n>1?'🟨':'🟩'):'🟥'}
// biggest surprise = the wrong call furthest from the truth (gentle "fraud" vs "murder" beats "fraud" vs "hacking")
function surprise(r){let best=null,bs=-1;r.res.forEach((x,i)=>{if(x.ok)return;const g=x.g||grp(BYID[r.ids[i]]||{});const s=Math.abs((SEV[x.b]||0)-(SEV[g]||0))*2+(x.n>1?0:1);if(s>bs){bs=s;best={i,b:x.b,g}}});return best}
function bias(r){const cnt={},hit={};r.res.forEach(x=>{cnt[x.b]=(cnt[x.b]||0)+1;if(x.ok)hit[x.b]=(hit[x.b]||0)+1});
 let top=null;for(const k in cnt)if(cnt[k]>=2&&(hit[k]||0)<cnt[k]&&(!top||cnt[k]>cnt[top]))top=k;return top?{g:top,n:cnt[top],k:hit[top]||0}:null}
function renderEnd(){const r=lastEnd;if(!r)return;run=r;const sc=score(r),n=r.res.length,k=rightN(r),w=n-k;
 $('gutT').textContent=T('gutT');
 if(r.mode==='d'){$('score').innerHTML=`${k}<small>/${n}</small>`;$('scoreL').textContent=T('gutOf')(k,n)+` · ${sc} ${L==='zh'?'分':'pts'}`;const q=k/Math.max(1,n);$('rank').textContent=T('rank')[q>=1?4:q>=.8?3:q>=.6?2:q>=.4?1:0];
  $('streak').textContent=T('streak')(streak());$('againBtn').textContent=T('endless2');$('hud').textContent=`#${dayNo(r.day)} · ${sc} ${L==='zh'?'分':'pts'}`}
 else{$('score').innerHTML=`${sc}<small>${L==='zh'?' 分':' pts'}</small>`;$('scoreL').textContent=`${T('gutOf')(k,n)} ${k}/${n}`;const best=Math.max(r.best||0,sc);$('rank').textContent=sc>(r.best||0)&&sc>0?T('newBest'):T('rank')[Math.min(4,Math.floor(k/3))];
  $('streak').textContent=T('endlessRes')(n,best);$('againBtn').textContent=T('again');$('hud').textContent=`${sc} ${L==='zh'?'分':'pts'}`}
 $('mis').textContent=T('mis')(w,n);
 const s=surprise(r),sc2=$('sur');
 if(s&&BYID[r.ids[s.i]]){const c=BYID[r.ids[s.i]];sc2.hidden=false;
  sc2.innerHTML=`<img src="${esc(c.im)}" alt="${esc(titleCase(nameOf(c)))}"><div><b>${esc(T('surT'))}</b><span>${esc(T('sur')(catTxt(s.b),catTxt(s.g)))}</span><a href="${esc(c.url)}" target="_blank" rel="noopener" lang="en">${esc(titleCase(nameOf(c)))} ↗</a></div>`}
 else{sc2.hidden=true;sc2.innerHTML=''}
 const bi=bias(r);$('bias').hidden=!bi;$('bias').textContent=bi?T('bias')(catTxt(bi.g),bi.n,bi.k):'';
 $('grid').textContent=r.res.map(sq).join('');$('prog').style.width='100%';
 renderHelp(r.mode==='d'?r.day:null)}
let helpPick=null;
function renderHelp(day){if(!MISSING.length){$('help').hidden=true;return}$('help').hidden=false;
 if(!helpPick||helpPick.k!==(day||'e')){const p=MISSING.slice();shuf(p,day?rng('help|'+day):Math.random);helpPick={k:day||'e',ids:p.slice(0,3).map(c=>c.id)}}
 $('hf').innerHTML=helpPick.ids.map(id=>BYID[id]).filter(Boolean).map(c=>{const k=c.k,pl=L==='zh'?k.plz:k.pl;const m=[k.y?T('since')(k.y):'',pl||''].filter(Boolean).join(' · ');
  return `<div class="hfc"><a href="${esc(c.url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"><img src="${esc(c.im)}" alt="" loading="lazy"></a><a class="n" href="${esc(c.url)}" target="_blank" rel="noopener" lang="en">${esc(titleCase(nameOf(c)))}</a><span class="m">${esc(m)}</span><a class="t" href="https://tips.fbi.gov/" target="_blank" rel="noopener" aria-label="${esc(T('tipS'))} ${esc(titleCase(nameOf(c)))}">${esc(T('tipS'))}</a></div>`}).join('')}
$('shareBtn').onclick=async()=>{const r=lastEnd,sc=score(r);let txt;const s=surprise(r);const sline=s?`😳 ${CAT[s.b].e}→${CAT[s.g].e}`:'';
 if(r.mode==='d'){txt=T('sh')(dayNo(r.day),rightN(r),r.res.length)+'\n'+r.res.map(sq).join('');if(sline)txt+='\n'+sline;const st=streak();if(st>1)txt+='\n'+T('shStreak')(st)}
 else{txt=T('shE')(sc,r.res.length)+'\n'+r.res.map(sq).join('');if(sline)txt+='\n'+sline}
 const url='https://liyun-li.github.io/look-again/?daily';
 try{if(navigator.share){await navigator.share({text:txt,url});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(txt+'\n'+url);$('toast').textContent=T('copied')}catch(e){$('toast').textContent=txt}setTimeout(()=>$('toast').textContent='',2500)};
$('againBtn').onclick=()=>start('e');

function renderStart(){const day=today(),dn=dayNo(day),d=LS.get('la4_daily'),res=(LS.get('la4_dres')||{})[day];
 if(res){$('dailyBtn').innerHTML=T('dailyDone')(dn,res.res.filter(x=>x.ok).length)}
 else if(d&&d.day===day&&d.res.length)$('dailyBtn').innerHTML=T('dailyRes')(dn,d.i);
 else $('dailyBtn').innerHTML=T('daily')(dn);
 $('endlessBtn').innerHTML=T('endless')(LS.get('la4_best')||0);
 const b=(LS.get('la2_book')||[]).length,nc=DATA?newClosed():0;$('bookBtn').innerHTML=esc(T('bookB')(b))+(nc?`<span class="dot" aria-label="${nc} ${L==='zh'?'張已不在名單上':'no longer listed'}">${nc}</span>`:'')}
async function start(mode){
 show('game');$('loading').hidden=false;$('retryBtn').hidden=true;$('loading').firstElementChild.textContent=T('loading');
 $('game').classList.add('wait');$('game').classList.remove('done');$('opts').innerHTML='';$('hud').textContent='';
 try{await (loadP||boot())}catch(e){loadP=null;$('loading').firstElementChild.textContent=T('loadFail');$('retryBtn').hidden=false;$('retryBtn').onclick=()=>start(mode);return}
 $('loading').hidden=true;$('game').classList.remove('wait');
 if(mode==='d'){const day=today(),res=(LS.get('la4_dres')||{})[day];
  if(res){const d=LS.get('la4_daily');lastEnd=d&&d.day===day?d:{mode:'d',day,ids:res.ids,res:res.res};show('end');renderEnd();return}
  const d=LS.get('la4_daily');if(d&&d.day===day&&d.ids.every(i=>BYID[i]))run=d;else newDaily()}
 else{const e=LS.get('la4_endless');if(e&&e.lives>0&&e.ids.every(i=>BYID[i]))run=e;else newEndless()}
 renderRound(true);$('b0')&&$('b0').focus({preventScroll:true})}
$('dailyBtn').onclick=()=>start('d');$('endlessBtn').onclick=()=>start('e');
$('logo').onclick=()=>{closeDlg();show('start');renderStart()};
function applyLang(){
 document.documentElement.lang=L==='zh'?'zh-Hant':'en';document.title=L==='zh'?'再看一眼 🔎 看臉猜罪名':'Look Again 🔎 Guess the crime';
 $('logo').innerHTML=L==='zh'?'再看<b>一眼</b>':'LOOK <b>AGAIN</b>';$('sTitle').innerHTML=L==='zh'?'再看<b>一眼</b>':'LOOK<b>AGAIN</b>';
 $('lEn').className=L==='en'?'on':'';$('lZh').className=L==='zh'?'on':'';
 document.querySelectorAll('[data-t]').forEach(e=>{const v=T(e.dataset.t);if(typeof v==='string')e.textContent=v});
 const ab='about.html'+(L==='zh'?'?lang=zh-Hant':'');$('aboutLink').href=ab;document.querySelectorAll('.foot a').forEach(a=>a.href=ab);
 if(DATA)$('upd').textContent=T('updated')(fmtDate(DATA.updated),poolN());
 $('book2Btn').setAttribute('aria-label',T('book').replace('📒 ',''));$('book2Btn').title=$('book2Btn').getAttribute('aria-label');$('dlgX').setAttribute('aria-label',L==='zh'?'關閉':'Close');
 renderStart();
 if($('game').classList.contains('on')&&run&&!$('game').classList.contains('wait'))renderRound(false);
 if($('end').classList.contains('on'))renderEnd()}
$('langBtn').onclick=()=>{L=L==='zh'?'en':'zh';LS.set('la_lang',L);applyLang()};
addEventListener('keydown',e=>{if($('dlg').open||!$('game').classList.contains('on')||!run||e.ctrlKey||e.metaKey||e.altKey)return;const n='1234'.indexOf(e.key);
 if(n>=0&&$('b'+n)&&!$('game').classList.contains('done'))$('b'+n).click();
 else if((e.key==='p'||e.key==='P')&&!$('game').classList.contains('done')){e.preventDefault();peek()}
 else if(e.key==='Enter'&&$('game').classList.contains('done')&&document.activeElement===document.body)$('next').click()});
applyLang();
if(/(^|[?&])daily\b/.test(location.search.slice(1)))start('d');
