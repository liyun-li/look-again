dialog{margin:auto;width:min(100% - 1.2rem,34rem);max-height:calc(100dvh - 1.2rem);border:0;border-radius:.6rem;background:var(--pap);color:var(--pink);padding:0;overflow:hidden}

.side{display:contents}

 #game.on{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:.4rem .8rem}

 helpT:"💛 幫忙找到他們",helpP:"這不是遊戲。這些人仍下落不明，若你知道任何消息，請告訴 FBI。",since:y=>`${y} 年起失蹤`,tipS:"提供線索 ↗",

 h:{when:(y,a)=>y&&a!=null?`🗓️ 事情從 ${y} 年開始，當時對方約 ${a} 歲。`:y?`🗓️ 事情從 ${y} 年開始。`:`🗓️ 當時對方約 ${a} 歲。`,

const $=id=>document.getElementById(id);
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let L=(()=>{const q=new URLSearchParams(location.search).get('lang');if(q)return /^zh/i.test(q)?'zh':'en';const s=LS.get('la_lang');if(s)return s;
 const ls=navigator.languages||[navigator.language||'en'];for(const l of ls){if(/^zh/i.test(l))return 'zh';if(/^en/i.test(l))return 'en'}return 'en'})();
const T=k=>S[L][k];
let DATA=null,BYID={},POOL={},MISSING=[],run=null,lastEnd=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c])}
// ---- seeded randomness (same docket for everyone on a date) ----
function h32(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=h32(String(seed));return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,r=Math.random){for(let i=a.length-1;i>0;i--){const j=r()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayNo(day){const [y,m,d]=day.split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-EPOCH)/864e5)+1}
function grp(c){return GMAP[c.c]}
function grpSet(c){const s=new Set([grp(c)]);for(const a of c.all||[])if(GMAP[a])s.add(GMAP[a]);return s}
// ---- data ----
async function getJSON(u,tries,opt){for(let k=0;k<tries;k++){try{const r=await fetch(u,{cache:'no-cache'});if(!r.ok){if(opt&&r.status===404)return null;throw 0}return await r.json()}catch(e){if(k<tries-1)await new Promise(r=>setTimeout(r,600*(k+1)))}}if(opt)return null;throw new Error('load')}
const withTimeout=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
let loadP=null;
function boot(){loadP=getJSON('cases.json',3).then(d=>{if(!d.cases||!d.cases.length)throw new Error('empty');DATA=d;BYID={};POOL={};MISSING=[];
 for(const c of d.cases){BYID[c.id]=c;const g=grp(c);if(g&&c.im)(POOL[g]=POOL[g]||[]).push(c);else if(c.c==='missing'&&c.im)MISSING.push(c)}
 $('upd').textContent=T('updated')(fmtDate(d.updated),d.n);renderStart();return d});
 return loadP}
boot().catch(()=>{});
function fmtDate(iso){const d=new Date(String(iso).replace(/Z$/,':00Z'));if(isNaN(d))return String(iso).slice(0,10);
 return d.toLocaleDateString(L==='zh'?'zh-TW':'en-US',{year:'numeric',month:'short',day:'numeric'})}
function money(n){if(!n)return '';if(L==='zh'){const w=n/1e4;return (w>=1?(w>=1e4?(w/1e4).toLocaleString('zh-TW')+' 億':w.toLocaleString('zh-TW',{maximumFractionDigits:1})+' 萬'):n.toLocaleString('zh-TW'))+' 美元'}
 return n>=1e6?'$'+(n/1e6).toLocaleString('en-US',{maximumFractionDigits:1})+' million':'$'+n.toLocaleString('en-US')}
// ---- clue ladders: cases.json k.cl (built + validated by tools/build_cases.py), heuristic only if a case has none ----
function heur(c){const k=c.k,H=S[L].h,o=[];
 if(k.y||k.age!=null)o.push(esc(H.when(k.y,k.age)));
 if(k.of)o.push(esc(H.office(L==='zh'?k.ofz:k.of)));else if(k.pl)o.push(esc(H.place(L==='zh'?k.plz:k.pl)));
 o.push(esc(H.rw(money(k.rw))));
 if(k.lg)o.push(esc(H.lang((L==='zh'?k.lgz:k.lg).join(L==='zh'?'、':', '))));
 else if(k.oc)o.push(esc(H.work('\u0001'+k.oc.join(', ')+'\u0002')).replace('\u0001','<span lang="en" class="en">').replace('\u0002','</span>'));
 if(k.ex){const e=esc(k.ex).replace(/▇▇/g,'<mark aria-label="redacted">▇▇</mark>');o.push(esc(H.ex('\u0001')).replace('\u0001',`<span lang="en" class="en">${e}</span>`))}
 return o.slice(-5)}
function cluesOf(c){const f=c.k&&c.k.cl&&c.k.cl[L];
 if(Array.isArray(f)){const v=f.filter(x=>typeof x==='string'&&x.trim()).slice(0,5);if(v.length>=3)return v.map(x=>esc(x).replace(/▇+/g,m=>`<mark aria-label="redacted">${m}</mark>`))}
 return heur(c)}
// ---- runs ----
function docketIds(day){const r=rng('docket|'+day),cnt={},ids=[];
 while(ids.length<DOCKET){const avail=GROUPS.filter(g=>(POOL[g]||[]).length&&(cnt[g]||0)<2&&(POOL[g].length>(cnt[g]||0)));if(!avail.length)break;
  const g=avail[r()*avail.length|0];cnt[g]=(cnt[g]||0)+1;
  const best=POOL[g].filter(c=>!ids.includes(c.id)).map(c=>[h32(day+'|'+c.id),c.id]).sort((a,b)=>a[0]-b[0])[0];if(best)ids.push(best[1])}
 return ids}
function optsFor(c,r){const set=grpSet(c),g=grp(c);const d=shuf(GROUPS.filter(x=>!set.has(x)&&(POOL[x]||[]).length),r).slice(0,3);return shuf([g,...d],r)}
function pickEndless(){const seen=new Set(LS.get('la2_seen')||[]);const used=new Set(run?run.ids:[]);
 const gs=GROUPS.filter(g=>(POOL[g]||[]).length);const g=gs[Math.random()*gs.length|0];
 let p=POOL[g].filter(c=>!seen.has(c.id)&&!used.has(c.id));if(!p.length)p=POOL[g].filter(c=>!used.has(c.id));if(!p.length)p=POOL[g];return p[Math.random()*p.length|0].id}
function newDaily(){const day=today(),ids=docketIds(day),r=rng('opts|'+day);run={mode:'d',day,ids,opts:ids.map(id=>optsFor(BYID[id],r)),i:0,n:1,res:[]};save()}
function newEndless(){run={mode:'e',ids:[],opts:[],i:0,n:1,res:[],lives:LIVES};addEndless();save()}
function addEndless(){const id=pickEndless();run.ids.push(id);run.opts.push(optsFor(BYID[id]))}
function save(){LS.set(run.mode==='d'?'la2_daily':'la2_endless',run)}
function cur(){return BYID[run.ids[run.i]]}
function score(){return run.res.reduce((s,x)=>s+x.p,0)}
function total(){return run.mode==='d'?run.ids.length:run.res.length}
function show(id){for(const s of ['start','game','end'])$(s).classList.toggle('on',s===id);document.body.classList.toggle('ingame',id==='game');document.body.classList.toggle('atend',id==='end');if(id==='start'){$('hud').textContent='';$('prog').style.width='0'}}
function bump(e){e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
function hud(){if(!run)return;const sc=score();
 if(run.mode==='d'){$('hud').textContent=`${Math.min(run.i+1,run.ids.length)}/${run.ids.length} · ${sc} ${L==='zh'?'分':'pts'}`;$('prog').style.width=(run.res.length/run.ids.length*100)+'%'}
 else{$('hud').textContent=`${'❤️'.repeat(run.lives)}${'🖤'.repeat(LIVES-run.lives)} · ${sc}`;$('prog').style.width=((LIVES-run.lives)/LIVES*100)+'%'}}
const preloaded=new Set();
// Portraits are never requested before the guess for that case (no preloading), so the face can't leak via cache or devtools.
function renderRound(fresh){
 const c=cur(),done=run.res.length>run.i,cl=cluesOf(c),N=cl.length;run.n=Math.max(1,Math.min(run.n,N));
 $('caseNo').textContent=run.mode==='d'?T('caseD')(run.i+1,run.ids.length):T('caseE')(run.i+1);
 $('ladder').innerHTML=cl.map((_,j)=>`<i${j<run.n?' class="on"':''}></i>`).join('');
 $('worth').textContent=T('worth')(PTS[run.n-1]);
 $('clues').innerHTML=cl.slice(0,run.n).map((x,j)=>`<li class="${j===run.n-1?(fresh?'new':'new last'):''}"><b>${j+1}</b><span>${x}</span></li>`).join('');
 if(!fresh)$('clues').querySelectorAll('.new').forEach(e=>e.style.animation='none');
 const cb=$('clueBtn');if(run.n<N){cb.disabled=false;cb.innerHTML=T('more')(PTS[run.n])}else{cb.disabled=true;cb.textContent=T('last')}
 $('opts').innerHTML=run.opts[run.i].map((b,j)=>`<button type="button" data-b="${b}" id="b${j}"><span aria-hidden="true">${j+1} </span>${esc(CAT[b][L])}</button>`).join('');
 $('opts').querySelectorAll('button').forEach(btn=>btn.onclick=()=>answer(btn.dataset.b));
 $('game').classList.toggle('done',done);
 if(done)renderReveal(true);else fit()
 hud()}
function fit(){const e=$('clues');let k=1.45;e.style.setProperty('--k',k);while(e.scrollHeight>e.clientHeight+1&&k>.6){k-=.05;e.style.setProperty('--k',k.toFixed(2))}}
function moreClue(){if(run.res.length>run.i)return;const N=cluesOf(cur()).length;if(run.n>=N)return;run.n++;save();renderRound(true);bump($('worth'));if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}}
$('clueBtn').onclick=moreClue;
function answer(b){if(run.res.length>run.i)return;const c=cur(),ok=b===grp(c),p=ok?PTS[run.n-1]:0;
 run.res.push({b,n:run.n,ok,p});if(run.mode==='e'&&!ok)run.lives--;save();addBook(c,ok,p);
 $('game').classList.add('done');renderReveal(false);hud();bump($('hud'));if(navigator.vibrate)try{navigator.vibrate(ok?[15,30,15]:[40])}catch(e){}}
function nameOf(c){return (c.title||'').split(/ - | – /)[0]}
function renderReveal(re){const c=cur(),x=run.res[run.i],g=grp(c);
 $('opts').querySelectorAll('button').forEach(e=>{e.disabled=true;e.classList.toggle('right',e.dataset.b===g);e.classList.toggle('wrong',e.dataset.b===x.b&&!x.ok)});
 $('verdict').textContent=x.ok?T('right')(x.p):T('wrong');$('verdict').className='verdict '+(x.ok?'ok':'no');
 $('rname').textContent=nameOf(c);$('rname').lang='en';
 const lst=LIST[c.c]?`<br><span class="badge">${esc(T('onList'))} ${esc(LIST[c.c][L])}</span>`:'';
 $('rcat').innerHTML=`${esc(T('was'))} ${esc(CAT[g][L])}${c.c==='topten'?lst:''}`;
 const first=(c.r.t||[]).slice(0,2).join(' ');
 $('rd').innerHTML=(L==='zh'?`<b>${esc(T('enNote'))}</b> `:'')+`<span lang="en">${esc(c.r.d?c.r.d+' — ':'')}${esc(first)}</span>`;
 $('rlegal').textContent=T('lgWanted');$('fbiLink').href=c.url;
 const pic=$('pic');pic.innerHTML='';
 if(c.im){const im=new Image();im.alt=nameOf(c);im.decoding='async';im.onerror=()=>{im.remove();pic.prepend(T('noPic'))};im.src=c.im;pic.appendChild(im)}else pic.textContent=T('noPic');
 const st=document.createElement('span');st.className='stamp '+(x.ok?'ok':'no');st.setAttribute('aria-hidden','true');st.textContent=x.ok?`+${x.p}`:'✗';pic.appendChild(st);
 const over=run.mode==='d'?run.i+1>=run.ids.length:run.lives<=0;$('next').textContent=over?T('finish'):T('next');
 if(!re)setTimeout(()=>$('next').focus({preventScroll:true}),60)}
function fullPoster(){const c=cur(),r=c.r;let h='';
 h+=`<h3>${esc(T('fullFiled'))}</h3><p>${esc(CAT[grp(c)][L])}${LIST[c.c]?' · '+esc(LIST[c.c][L]):''}</p>`;
 if(r.w)h+=`<p class="w" lang="en">${esc(r.w)}</p>`;
 if(r.d)h+=`<h3>${esc(T('fullDesc'))}</h3><p lang="en">${esc(r.d)}</p>`;
 if(r.t&&r.t.length)h+=`<h3>${esc(T('fullText'))}</h3>`+r.t.map(s=>`<p lang="en">${esc(s)}</p>`).join('');
 if(r.rm&&r.rm.filter(Boolean).length)h+=`<h3>${esc(T('fullRm'))}</h3>`+r.rm.filter(Boolean).map(s=>`<p lang="en">${esc(s)}</p>`).join('');
 if(r.rw)h+=`<h3>${esc(T('fullRw'))}</h3><p lang="en">${esc(r.rw)}</p>`;
 h+=`<p><i>${esc(T('lgWanted'))}</i></p><p><i>${esc(T('cutNote'))}</i></p>`;
 h+=`<p><a href="https://tips.fbi.gov/" target="_blank" rel="noopener"><b>${esc(T('tip'))}</b></a><br><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(T('fbi'))}</a></p>`;
 openDlg(nameOf(c),h)}
$('fullBtn').onclick=fullPoster;
function openDlg(t,h){$('dlgT').textContent=t;$('dlgB').innerHTML=h;$('dlgB').scrollTop=0;const d=$('dlg');if(!d.open){d.showModal();history.pushState({dlg:1},'')}}
function closeDlg(){const d=$('dlg');if(d.open){d.close();if(history.state&&history.state.dlg)history.back()}}
$('dlgX').onclick=closeDlg;$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))closeDlg()});
$('dlg').addEventListener('cancel',e=>{e.preventDefault();closeDlg()});
addEventListener('popstate',()=>{const d=$('dlg');if(d.open)d.close()});
$('next').onclick=()=>{const over=run.mode==='d'?run.i+1>=run.ids.length:run.lives<=0;
 if(over){finish();return}run.i++;run.n=1;if(run.mode==='e'&&run.i>=run.ids.length)addEndless();save();renderRound(true);$('b0')&&$('b0').focus({preventScroll:true})};
// ---- casebook ----
function addBook(c,ok,p){const b=(LS.get('la2_book')||[]).filter(x=>x.id!==c.id);
 b.unshift({id:c.id,t:nameOf(c),g:grp(c),l:c.c,u:c.url,d:today(),ok,p});LS.set('la2_book',b.slice(0,400))}
function closedIds(){if(!DATA)return[];return (LS.get('la2_book')||[]).filter(x=>!BYID[x.id]).map(x=>x.id)}
function newClosed(){const seen=new Set(LS.get('la2_closedSeen')||[]);return closedIds().filter(i=>!seen.has(i)).length}
const RES={captured:['Captured','已逮捕'],surrendered:['Surrendered','已自首'],located:['Located','已尋獲'],recovered:['Recovered','已尋回'],resolved:['Resolved','已解決']};
// Only the FBI API's own status (cases.json "res") may say found/caught; nothing is inferred from a poster disappearing.
function closedNote(id){const r=DATA&&DATA.res&&DATA.res[id];return r&&RES[r]?`<br><b>${esc((L==='zh'?'FBI 標示狀態：':'FBI status: ')+RES[r][L==='zh'?1:0])}</b>`:''}
function openBook(){const b=LS.get('la2_book')||[];const cl=closedIds();let h='';
 if(!b.length)h=`<p>${esc(T('bookEmpty'))}</p>`;
 else{h=`<p>${esc(T('bookIntro')(b.length,cl.length))}</p><ul>`+b.map(x=>{const live=BYID[x.id];
  const img=live&&live.im?`<img src="${esc(live.im)}" alt="" loading="lazy">`:`<span class="ph" aria-hidden="true">📁</span>`;
  const st=live?`<span class="open">${esc(T('stillOpen'))}</span>`:`<span class="closed">${esc(T('closed'))}</span>${closedNote(x.id)}`;
  return `<li>${img}<div><a href="${esc(x.u)}" target="_blank" rel="noopener" lang="en">${esc(x.t)}</a><br>${esc(CAT[x.g]?CAT[x.g][L]:'')} ${x.ok?'✓ +'+x.p:'✗'} · <small>${esc(T('played')(x.d))}</small><br>${st}</div></li>`}).join('')+`</ul>`;
  if(cl.length)h+=`<p><small>${esc(T('closedWhy'))}</small></p>`}
 h+=`<p><a href="https://tips.fbi.gov/" target="_blank" rel="noopener"><b>${esc(T('tip'))}</b></a></p>`;
 LS.set('la2_closedSeen',cl);openDlg(T('bookT'),h);renderStart()}
$('bookBtn').onclick=openBook;$('book2Btn').onclick=openBook;
// ---- end ----
function finish(){const seen=new Set(LS.get('la2_seen')||[]);run.ids.forEach(i=>seen.add(i));LS.set('la2_seen',[...seen].slice(-500));
 if(run.mode==='d'){const days=new Set(LS.get('la2_days')||[]);days.add(run.day);LS.set('la2_days',[...days].sort().slice(-400));
  const res=LS.get('la2_dres')||{};res[run.day]={res:run.res,ids:run.ids};LS.set('la2_dres',res);run.fin=1;save()}
 else{const b=LS.get('la2_best')||0;run.best=b;if(score()>b)LS.set('la2_best',score());LS.del('la2_endless')}
 lastEnd=run;show('end');renderEnd()}
function streak(){const days=new Set(LS.get('la2_days')||[]);let n=0;const d=new Date();if(!days.has(today()))d.setDate(d.getDate()-1);
 for(;;){const s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(!days.has(s))break;n++;d.setDate(d.getDate()-1)}return n}
function rows(r){return r.res.map(x=>'🟨'.repeat(x.n-1)+(x.ok?'🟩':'🟥'))}
function renderEnd(){const r=lastEnd;if(!r)return;run=r;const sc=score();
 if(r.mode==='d'){const mx=r.ids.length*PTS[0];$('score').innerHTML=`${sc}<small>/${mx}</small>`;const q=sc/mx;$('rank').textContent=T('rank')[q>=.9?4:q>=.65?3:q>=.4?2:q>=.2?1:0];
  $('streak').textContent=T('streak')(streak());$('againBtn').textContent=T('endless2');$('hud').textContent=`#${dayNo(r.day)} · ${sc} ${L==='zh'?'分':'pts'}`}
 else{$('score').textContent=sc;const best=Math.max(r.best||0,sc);$('rank').textContent=sc>(r.best||0)&&sc>0?T('newBest'):T('rank')[Math.min(4,Math.floor(r.res.length/4))];
  $('streak').textContent=T('endlessRes')(r.res.length,best);$('againBtn').textContent=T('again');$('hud').textContent=`${sc} ${L==='zh'?'分':'pts'}`}
 $('grid').innerHTML=rows(r).map(x=>`<span>${x}</span>`).join('');$('prog').style.width='100%';
 renderHelp(r.mode==='d'?r.day:null)}
let helpPick=null;
function renderHelp(day){if(!MISSING.length){$('help').hidden=true;return}$('help').hidden=false;
 if(!helpPick||helpPick.k!==(day||'e')){const p=MISSING.slice();shuf(p,day?rng('help|'+day):Math.random);helpPick={k:day||'e',ids:p.slice(0,3).map(c=>c.id)}}
 $('hf').innerHTML=helpPick.ids.map(id=>BYID[id]).filter(Boolean).map(c=>{const k=c.k,pl=L==='zh'?k.plz:k.pl;const m=[k.y?T('since')(k.y):'',pl||''].filter(Boolean).join(' · ');
  return `<div class="hfc"><a href="${esc(c.url)}" target="_blank" rel="noopener"><img src="${esc(c.im)}" alt="${esc(nameOf(c))}" loading="lazy"></a><a class="n" href="${esc(c.url)}" target="_blank" rel="noopener" lang="en">${esc(titleCase(nameOf(c)))}</a><span class="m">${esc(m)}</span><a class="t" href="https://tips.fbi.gov/" target="_blank" rel="noopener" aria-label="${esc(T('tipS'))} ${esc(titleCase(nameOf(c)))}">${esc(T('tipS'))}</a></div>`}).join('')}
function titleCase(s){return s.toLowerCase().replace(/(^|[\s\-'"(])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase())}
$('shareBtn').onclick=async()=>{const r=lastEnd,sc=score();let txt;
 if(r.mode==='d'){txt=T('sh')(dayNo(r.day),sc,r.ids.length*PTS[0])+'\n'+rows(r).join('\n');const s=streak();if(s>1)txt+='\n'+T('shStreak')(s)}
 else txt=T('shE')(sc,r.res.length)+'\n'+rows(r).join(' ');
 const url='https://liyun-li.github.io/look-again/';
 try{if(navigator.share){await navigator.share({text:txt,url});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(txt+'\n'+url);$('toast').textContent=T('copied')}catch(e){$('toast').textContent=txt}setTimeout(()=>$('toast').textContent='',2500)};
$('againBtn').onclick=()=>start('e',false);
// ---- start ----
function renderStart(){const day=today(),dn=dayNo(day),d=LS.get('la2_daily'),res=(LS.get('la2_dres')||{})[day];
 if(res){const p=res.res.reduce((s,x)=>s+x.p,0);$('dailyBtn').innerHTML=T('dailyDone')(dn,p)}
 else if(d&&d.day===day&&d.res.length)$('dailyBtn').innerHTML=T('dailyRes')(dn,d.i);
 else $('dailyBtn').innerHTML=T('daily')(dn);
 $('endlessBtn').innerHTML=T('endless')(LS.get('la2_best')||0);
 const b=(LS.get('la2_book')||[]).length,nc=DATA?newClosed():0;$('bookBtn').innerHTML=esc(T('bookB')(b))+(nc?`<span class="dot" aria-label="${nc} ${L==='zh'?'案已不在名單上':'no longer listed'}">${nc}</span>`:'')}
async function start(mode,fromBtn){
 show('game');$('loading').hidden=false;$('retryBtn').hidden=true;$('loading').firstElementChild.textContent=T('loading');
 $('game').classList.add('wait');$('game').classList.remove('done');$('opts').innerHTML='';$('hud').textContent='';
 try{await (loadP||boot())}catch(e){loadP=null;$('loading').firstElementChild.textContent=T('loadFail');$('retryBtn').hidden=false;$('retryBtn').onclick=()=>start(mode);return}
 $('loading').hidden=true;$('game').classList.remove('wait');
 if(mode==='d'){const day=today(),res=(LS.get('la2_dres')||{})[day];
  if(res){const d=LS.get('la2_daily');lastEnd=d&&d.day===day?d:{mode:'d',day,ids:res.ids,res:res.res};show('end');renderEnd();return}
  const d=LS.get('la2_daily');if(d&&d.day===day&&d.ids.every(i=>BYID[i]))run=d;else newDaily()}
 else{const e=LS.get('la2_endless');if(e&&e.lives>0&&e.ids.every(i=>BYID[i]))run=e;else newEndless()}
 renderRound(true);$('b0')&&$('b0').focus({preventScroll:true})}
$('dailyBtn').onclick=()=>start('d');$('endlessBtn').onclick=()=>start('e');
$('logo').onclick=()=>{closeDlg();show('start');renderStart()};
function applyLang(){
 document.documentElement.lang=L==='zh'?'zh-Hant':'en';document.title=L==='zh'?'再看一眼 🔎':'Look Again 🔎';
 $('logo').innerHTML=L==='zh'?'再看<b>一眼</b>':'LOOK <b>AGAIN</b>';$('sTitle').innerHTML=L==='zh'?'再看<b>一眼</b>':'LOOK<b>AGAIN</b>';
 $('lEn').className=L==='en'?'on':'';$('lZh').className=L==='zh'?'on':'';
 document.querySelectorAll('[data-t]').forEach(e=>{const v=T(e.dataset.t);if(typeof v==='string')e.textContent=v});
 const ab='about.html'+(L==='zh'?'?lang=zh-Hant':'');$('aboutLink').href=ab;document.querySelectorAll('.foot a').forEach(a=>a.href=ab);
 if(DATA)$('upd').textContent=T('updated')(fmtDate(DATA.updated),DATA.n);
 $('book2Btn').setAttribute('aria-label',T('book').replace('📒 ',''));$('book2Btn').title=$('book2Btn').getAttribute('aria-label');$('dlgX').setAttribute('aria-label',L==='zh'?'關閉':'Close');
 renderStart();
 if($('game').classList.contains('on')&&run&&!$('game').classList.contains('wait'))renderRound(false);
 if($('end').classList.contains('on'))renderEnd()}
$('langBtn').onclick=()=>{L=L==='zh'?'en':'zh';LS.set('la_lang',L);applyLang()};
addEventListener('resize',()=>{if($('game').classList.contains('on')&&run&&!$('game').classList.contains('done'))fit()});
addEventListener('keydown',e=>{if($('dlg').open||!$('game').classList.contains('on')||!run||e.ctrlKey||e.metaKey||e.altKey)return;const n='1234'.indexOf(e.key);
 if(n>=0&&$('b'+n)&&!$('b'+n).disabled)$('b'+n).click();else if((e.key==='c'||e.key==='C'||e.key===' ')&&!$('game').classList.contains('done')&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();moreClue()}
 else if(e.key==='Enter'&&$('game').classList.contains('done')&&document.activeElement===document.body)$('next').click()});
applyLang();
</script>
